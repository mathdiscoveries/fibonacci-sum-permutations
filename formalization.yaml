alignment:
  namespace: "FibSumPermChallenge"
  statements:
    - source: "If-direction of Layman's conjecture"
      lean: "FibSumPermChallenge.layman_unique_if"
      module: "Challenge"
      status: proved
      note: "Unique Fibonacci-sum permutation at every Layman number w(n)."
    - source: "Complete characterization (Layman w)"
      lean: "FibSumPermChallenge.hajnal_conjecture_1"
      module: "Challenge"
      status: proved
      note: "fibPermCount k = 1 iff k = w(n) for some n >= 1."
    - source: "Complete characterization (Hajnal M4)"
      lean: "FibSumPermChallenge.hajnal_conjecture_1_M4"
      module: "Challenge"
      status: proved
      note: "fibPermCount k = 1 iff k = M4(l) for some l >= 2."
    - source: "Floor formula w(n) = floor(F_{n+3} / sqrt(5))"
      lean: "FibSumPermChallenge.w_eq_floor_fib_div_sqrt5"
      module: "Challenge"
      status: proved
      note: "Closed-form floor identity for all n >= 1 (Reshetnikov 2015, OEIS A097083)."

acknowledgements: "Built on Lean 4 and Mathlib."
