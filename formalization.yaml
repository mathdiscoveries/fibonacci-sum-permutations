# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Uniqueness Characterization of Fibonacci-Sum Permutations (Layman's Conjecture / Hajnal Conjecture 1)"
  description: >-
    Unconditional Lean 4 + Mathlib formalization proving that, for every
    integer k >= 1, there is exactly one permutation p of {1, ..., k} with
    every i + p(i) a Fibonacci number if and only if k = w(n) for some n >= 1
    (equivalently, k = M4(l) for some l >= 2), where Layman's sequence is
    w(n) = floor(F_{n+3} / sqrt(5)) for n >= 1. Formalizes the companion paper's
    proofs of Hajnal's (2022) "only if" direction, of the "if" direction
    (Hajnal Conjecture 1, by a step lemma) and of the floor formula
    conjectured by Reshetnikov (2015, OEIS A097083). Companion
    write-up and dated prior-work searches (arXiv, OEIS, zbMATH, CORE
    2026-11-20, Google Scholar 2026-11-22) are published at
    https://mathdiscoveries.org/results/fibonacci-sum-permutations; the "if"
    direction was not found in those logged searches (MathSciNet and print
    problem sections remain unsearched). Coverage by this package's Palomar
    comparison: of the companion paper's 7 main results, 3 are compared in
    Lean in full (43%; Theorems 1 and 7 and Corollary 2) and 1 in part
    (Theorem 6: a(w_n) = 1, without its clause that no valid permutation has
    a sum F_{n+1}); Propositions 3 and 4 and Theorem 5, with the full Theorem
    6, are proved in this package's Lean library but not compared;
    Conjecture 8 is open and not counted. Abstract claims: 3 of 6 compared in
    full (50%), 1 in part, 2 proved in the library but not compared.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["05A05", "11B39"]

sources:
  - title: "A short note on Layman permutations"
    authors:
      - "Peter Hajnal"
    id: "https://doi.org/10.2478/ausm-2022-0015"
    type: paper
    location: "Acta Universitatis Sapientiae, Mathematica 14(2) (2022), 231-238"
    relationship: adapts
    note: >-
      Proves the 'only if' direction of the uniqueness characterization,
      formalized as part of hajnal_conjecture_1 and hajnal_conjecture_1_M4 by
      way of the companion paper's self-contained proof, which follows
      Hajnal's, and poses the 'if' direction as Conjecture 1, which the
      companion paper proves (Theorem 6).
  - title: "OEIS A097083: Numbers k having a unique Fibonacci-sum permutation"
    authors:
      - "John W. Layman"
    id: "https://oeis.org/A097083"
    type: other
    location: "OEIS A097083 (Layman 2004; floor formula by V. Reshetnikov 2015)"
    relationship: background
    note: >-
      Introduces the uniqueness sequence (alongside counts in OEIS A097082)
      and records Reshetnikov's (2015) conjectured closed form
      w(n) = floor(F_{n+3} / sqrt(5)). The entry gives no proof; the floor
      formula is proved in the companion paper (Theorem 7) and formalized in
      w_eq_floor_fib_div_sqrt5.
  - title: "On permutations of {1,...,n} and related topics"
    authors:
      - "Zhi-Wei Sun"
    id: "https://doi.org/10.1007/s10801-021-01028-8"
    type: paper
    location: "Journal of Algebraic Combinatorics 54 (2021), no. 3, 893-912; preprint arXiv:1811.10503 (2018)"
    relationship: independently-proves
    note: >-
      arXiv v6 read, pp. 1-2. Remark 1.1 (p. 2) reports a Mathematica count
      of the Fibonacci-sum permutations for n <= 20, "(f(1), ..., f(20)) =
      (1, 1, 1, 2, 1, 2, 4, 2, 1, 4, 4, 20, 4, 5, 1, 20, 24, 8, 96, 200)",
      and gives "(2, 3)(4, 9)(5, 8)(6, 7)" as "the unique permutation in S9".
      Since w(1), ..., w(6) = 1, 2, 3, 5, 9, 15, layman_unique_if
      independently proves those uniqueness counts. Sun also proves, in
      Corollary 1.1, that a valid involution exists for every positive k.
  - title: "Unique Fibonacci-Sum Permutations: Proof of Hajnal's Conjecture and Reshetnikov's Floor Formula"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/fibonacci-sum-permutations"
    type: paper
    location: "https://mathdiscoveries.org/results/fibonacci-sum-permutations"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The companion paper. It states and proves in writing every compared
      statement of this package (Theorems 1, 6 and 7, Corollary 2), and the
      Lean work formalizes them; the formalization presents no result that the
      paper does not. The "only if" direction is Hajnal's printed theorem
      (listed above), of which the paper gives a self-contained proof. Logged
      prior-work searches (arXiv, OEIS edit histories, zbMATH, Semantic
      Scholar, OpenAlex, CORE 2026-11-20, Google Scholar 2026-11-22) did not
      find a prior proof of the "if" direction; MathSciNet, full zbMATH
      review, and print problem sections remain unsearched. AI research
      agents built and directed by Tyler B. Hughes generated and checked this
      work. No human mathematician has yet refereed the proof.

