# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Uniqueness Characterization of Fibonacci-Sum Permutations (Layman's Conjecture / Hajnal Conjecture 1)"
  description: >-
    Unconditional Lean 4 + Mathlib formalization proving that there exists a
    unique permutation p of {1, ..., k} with every i + p(i) a Fibonacci number
    if and only if k belongs to Layman's sequence w(n) = floor(F_{n+3} / sqrt(5))
    (equivalently Hajnal's M4 sequence). Formalizes Hajnal's (2022) "only if"
    direction and Reshetnikov's (2015, OEIS A097083) floor formula alongside a
    step-lemma proof of the "if" direction (Hajnal Conjecture 1). Companion
    write-up and dated prior-work searches (arXiv, OEIS, zbMATH, CORE
    2026-11-20, Google Scholar 2026-11-22) are published at
    https://mathdiscoveries.org/results/fibonacci-sum-permutations; the "if"
    direction was not found in those logged searches (MathSciNet and print
    problem sections remain unsearched).
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["05A05", "11B39"]

sources:
  - title: "A short note on Layman permutations"
    authors:
      - "Peter Hajnal"
    id: "https://doi.org/10.2478/ausm-2022-0015"
    type: paper
    location: "Acta Universitatis Sapientiae, Mathematica 14(2) (2022), 231-238"
    relationship: formalizes
    note: >-
      Proves the 'only if' direction of the uniqueness characterization
      (formalized as part of hajnal_conjecture_1 and hajnal_conjecture_1_M4)
      and poses the 'if' direction as Conjecture 1, proved here via a
      step-lemma induction argument.
  - title: "OEIS A097083: Numbers k having a unique Fibonacci-sum permutation"
    authors:
      - "John W. Layman"
    id: "https://oeis.org/A097083"
    type: other
    location: "OEIS A097083 (Layman 2004; floor formula by V. Reshetnikov 2015)"
    relationship: formalizes
    note: >-
      Introduces the uniqueness sequence (alongside counts in OEIS A097082)
      and records Reshetnikov's (2015) closed-form floor identity
      w(n) = floor(F_{n+3} / sqrt(5)), formalized in w_eq_floor_fib_div_sqrt5.
  - title: "On permutations of {1,...,n} and related topics"
    authors:
      - "Zhi-Wei Sun"
    id: "https://doi.org/10.1007/s10801-021-01028-8"
    type: paper
    location: "Journal of Algebraic Combinatorics 54 (2021), no. 3, 893-912; preprint arXiv:1811.10503 (2018)"
    relationship: background
    note: "Establishes existence of a Fibonacci-sum permutation for every k >= 1."
  - title: "Uniqueness of Fibonacci-sum permutations at Layman's numbers"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/fibonacci-sum-permutations"
    type: other
    location: "Companion page, verification archive, and prior-work search log at https://mathdiscoveries.org/results/fibonacci-sum-permutations"
    relationship: other
    note: >-
      Step-lemma proof of the "if" direction (layman_unique_if) and full
      Lean 4 formalization produced by AI research agents built and directed by
      Tyler B. Hughes. Logged prior-work searches (arXiv, OEIS edit histories,
      zbMATH, Semantic Scholar, OpenAlex, CORE 2026-11-20, Google Scholar
      2026-11-22) did not find a prior proof of the "if" direction; MathSciNet,
      full zbMATH review, and print problem sections remain unsearched.

